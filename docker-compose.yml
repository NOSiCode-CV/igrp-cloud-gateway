services:
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - igrp-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  igrp-gateway:
    build: .
    container_name: igrp-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # Observability: start the stack below with `docker compose --profile observability up -d`
      - OTEL_DISABLED=${OTEL_DISABLED:-true}
      - OTEL_COLLECTOR_ENDPOINT=${OTEL_COLLECTOR_ENDPOINT:-http://otel-collector:4318}
    networks:
      - igrp-network
    labels:
      logging: "promtail"

  # ---------------------------------------------------------------------------
  # Observability stack (OpenTelemetry collector → Tempo / Prometheus / Loki → Grafana)
  # Opt-in: docker compose --profile observability up -d
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.82.0
    container_name: otel-collector
    profiles: [ "observability" ]
    restart: always
    command:
      - --config=/etc/otelcol-cont/otel-collector.yml
    volumes:
      - ./monitoring/collector/otel-collector.yml:/etc/otelcol-cont/otel-collector.yml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "55679:55679" # zpages extension
    networks:
      - igrp-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    profiles: [ "observability" ]
    command: "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - igrp-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    profiles: [ "observability" ]
    environment:
      - PROMTAIL_SERVICE_INTERNAL_PORT=9080
      - LOKI_SERVICE_INTERNAL_PORT=3100
    command: "--config.expand-env=true --config.file=/etc/promtail/docker-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-docker-config.yml:/etc/promtail/docker-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - igrp-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    profiles: [ "observability" ]
    command: "-config.expand-env=true -config.file=/etc/loki/local-config.yaml"
    ports:
      - "3100:3100"
    depends_on:
      - promtail
    networks:
      - igrp-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    profiles: [ "observability" ]
    command: "-config.expand-env=true -config.file /etc/tempo-config.yml"
    environment:
      - TEMPO_SERVICE_HTTP_PORT=3200
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo-config.yml
    ports:
      - "3200:3200" # Tempo
      - "9411:9411" # Zipkin
    networks:
      - igrp-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    profiles: [ "observability" ]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - igrp-network

networks:
  igrp-network:
    driver: bridge

volumes:
  grafana_data:
    driver: local
