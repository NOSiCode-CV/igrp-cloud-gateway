# General
spring:
  application:
    name: igrp-cloud-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  cloud:
    gateway:
      server:
        webflux:
          # Peers allowed to send Forwarded / X-Forwarded-* / X-Real-IP headers (Java regex on the IP).
          # Defaults to the private ranges, where the ingress and pods live; narrow it to the ingress
          # controller with SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTEDPROXIES. Headers from any other
          # peer are stripped. It must not be empty: Spring Cloud Gateway then strips every
          # X-Forwarded-* header, including the X-Forwarded-Prefix set by the discovery routes.
          trusted-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|f[cd][0-9a-f]{2}:.*'
          # The gateway forwards proxy headers as received from trusted peers and adds none of its own:
          # its X-Forwarded-For handling drops the client IP, it would append its hop to the routes'
          # X-Forwarded-Prefix ("/svc,/svc"), and services prefer a Forwarded header over X-Forwarded-*.
          forwarded:
            enabled: false
          x-forwarded: # kebab-case on purpose: read by @ConditionalOnProperty
            for-enabled: false
            host-enabled: false
            port-enabled: false
            proto-enabled: false
            prefix-enabled: false

# Actuator endpoints
# The gateway itself has no authentication, so only the health probes are exposed and every
# endpoint is capped at read-only. Override through environment variables when needed, e.g.
#   MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,gateway
#   MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=always
#   MANAGEMENT_SERVER_PORT=8082   (serve actuator on a separate, non-public port)
management:
  endpoints:
    access:
      maxPermitted: read-only
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      showDetails: never
      showComponents: never
      probes:
        enabled: true

# Gateway hardening (see cv.igrp.platform.igrpcloudgateway.security)
igrp:
  gateway:
    security:
      # Requests whose path contains any of these segments below the root are rejected with 404,
      # so the proxied services' actuator endpoints (/{service}/actuator/**) are never public.
      # The gateway's own /actuator stays governed by the management.* settings above.
      blockedPathSegments: ${IGRP_GATEWAY_BLOCKED_PATH_SEGMENTS:actuator}

# Observability (OpenTelemetry → OTLP collector)
# Traces, metrics and logs are exported to OTEL_COLLECTOR_ENDPOINT. Disabled unless OTEL_DISABLED=false.
otel:
  sdk:
    disabled: ${OTEL_DISABLED:true}
  resource:
    attributes:
      "[service.name]": ${spring.application.name}
      "[deployment.environment]": ${SPRING_PROFILES_ACTIVE:development}
  exporter:
    otlp:
      endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:otlp}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:otlp}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:otlp}
  instrumentation:
    # Bridge the Micrometer meters registered by Spring Boot (JVM, gateway, Reactor Netty...) to OTLP
    micrometer:
      enabled: true

# Logging configuration
# GATEWAY_LOG_LEVEL=DEBUG traces route discovery and matching per request; use it only to troubleshoot.
logging:
  pattern:
    # Prefix log lines with the OpenTelemetry trace/span ids for log ↔ trace correlation
    correlation: "[${spring.application.name:},%X{trace_id:-},%X{span_id:-}] "
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    cv.igrp.platform: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.cloud.gateway.discovery.DiscoveryClientRouteDefinitionLocator: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.cloud.gateway.handler.predicate: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.cloud.loadbalancer: ${GATEWAY_LOG_LEVEL:INFO}
    org.springframework.cloud.kubernetes.discovery: ${GATEWAY_LOG_LEVEL:INFO}
