# General
spring:
  application:
    name: igrp-cloud-gateway
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:development}

# Server configuration
server:
  port: ${GATEWAY_PORT:8080}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: ${GATEWAY_LOG_LEVEL:DEBUG}
    cv.igrp.platform: ${GATEWAY_LOG_LEVEL:DEBUG}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:DEBUG}
    reactor.netty.http.server: ${GATEWAY_LOG_LEVEL:DEBUG}