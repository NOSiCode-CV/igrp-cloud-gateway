# Eureka client configuration (disabled in production, using Kubernetes instead)
eureka.client.enabled=false
# Kubernetes configuration
spring.cloud.kubernetes.config.enable-api=true
spring.cloud.kubernetes.config.enabled=true
spring.cloud.kubernetes.discovery.enabled=true
spring.cloud.kubernetes.loadbalancer.enabled=true
spring.cloud.kubernetes.reload.enabled=true
# Kubernetes discovery configuration
spring.cloud.kubernetes.discovery.all-namespaces=false
spring.cloud.kubernetes.discovery.wait-cache-ready=true
# Logging configuration
logging.level.root=${GATEWAY_LOG_LEVEL:INFO}
logging.level.cv.igrp.platform=${GATEWAY_LOG_LEVEL:INFO}
logging.level.org.springframework.cloud.gateway=${GATEWAY_LOG_LEVEL:INFO}