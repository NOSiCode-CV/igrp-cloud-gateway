# Eureka client configuration (disabled in production, using Kubernetes instead)
eureka:
  client:
    enabled: false

# Kubernetes configuration
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
              include-expression: "metadata['gateway.expose'] == 'true'"
              predicates:
                - name: Path
                  args:
                    pattern: "'/' + serviceId + '/**'"
              filters:
                - name: SetRequestHeader
                  args:
                    name: X-Forwarded-Prefix
                    value: "'/' + serviceId"
                - name: RewritePath
                  args:
                    regexp: "'/' + serviceId + '/?(?<remaining>.*)'"
                    replacement: "'/${remaining}'"
          route-refresh-listener:
            enabled: true

    discovery:
      enabled: true

    kubernetes:
      discovery:
        enabled: true
        metadata:
          add-labels: true
          add-annotations: true
        all-namespaces: false
        service-labels:
          gateway.expose: "true"
      reload:
        enabled: true
        mode: event
        strategy: refresh
        period: 10000ms

    loadbalancer:
      cache:
        ttl: 15
        capacity: 256
      health-check:
        interval: 30s
