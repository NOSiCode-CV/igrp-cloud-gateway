# Eureka client configuration (disabled in production, using Kubernetes instead)
eureka:
  client:
    enabled: false

# Kubernetes configuration
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
              includeExpression: "metadata['gateway.expose'] == 'true'"
          routeRefreshListener:
            enabled: true
    discovery:
      enabled: true
    kubernetes:
      discovery:
        enabled: true
        metadata:
          addLabels: true
          addAnnotations: true
        allNamespaces: false
        serviceLabels:
          gateway.expose: "true"
      reload:
        enabled: true
        mode: event
        strategy: refresh
        period: 10000ms

    loadbalancer:
      cache:
        ttl: 15
        capacity: 256
      healthCheck:
        interval: 30s