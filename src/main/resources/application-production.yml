# Eureka client configuration (disabled in production, using Kubernetes instead)
eureka:
  client:
    enabled: false

# Kubernetes configuration
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: true
              include-expression: "metadata['gateway.expose'] == 'true'"
          route-refresh-listener:
            enabled: true
    discovery:
      enabled: true
    kubernetes:
      discovery:
        enabled: true
        metadata:
          add-labels: true
          add-annotations: true
        all-namespaces: false
        service-labels:
          gateway.expose: "true"
      reload:
        enabled: true
        mode: event
        strategy: refresh
        period: 60000ms

    loadbalancer:
      cache:
        ttl: 30
        capacity: 256
      health-check:
        interval: 30s